services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cometfit
      MYSQL_USER: cometfit
      MYSQL_PASSWORD: cometfit
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      retries: 20
